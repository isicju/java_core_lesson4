<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MockDex — Live Index</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #0b0e11;
            color: #e6e6e6;
            padding: 30px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            border-bottom: 1px solid #222;
            padding-bottom: 16px;
            margin-bottom: 20px;
        }
        .header h1 {
            font-size: 22px;
            letter-spacing: 1px;
            margin: 0;
            color: #f5b301;
        }
        #status {
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 12px;
        }
        .connected { background: #123321; color: #4caf50; }
        .disconnected { background: #331212; color: #f44336; }

        .board {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
        }

        .price-panel {
            min-width: 260px;
        }
        #index-value {
            font-size: 56px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }
        #index-change {
            font-size: 18px;
            font-weight: 600;
            margin-top: 4px;
        }
        .up { color: #26a65b; }
        .down { color: #e5493a; }

        .chart-wrap {
            flex: 1;
            min-width: 320px;
            background: #12161c;
            border: 1px solid #1e242b;
            border-radius: 8px;
            padding: 12px;
        }
        canvas { width: 100%; height: 260px; display: block; }

        table {
            width: 100%;
            margin-top: 24px;
            border-collapse: collapse;
            font-size: 13px;
        }
        th, td {
            text-align: left;
            padding: 6px 10px;
            border-bottom: 1px solid #1e242b;
        }
        th { color: #888; font-weight: 500; }
        tr:hover { background: #12161c; }

        .ticker-tape {
            margin-top: 24px;
            overflow: hidden;
            white-space: nowrap;
            background: #12161c;
            border: 1px solid #1e242b;
            border-radius: 8px;
            padding: 10px 0;
        }
        .ticker-track {
            display: inline-block;
            animation: scroll 18s linear infinite;
        }
        .ticker-item { display: inline-block; margin: 0 24px; font-size: 13px; }
        @keyframes scroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
    </style>
</head>
<body>

<div class="header">
    <h1>MOCKDEX &nbsp;·&nbsp; Simulated Index</h1>
    <div id="status" class="disconnected">Disconnected</div>
</div>

<div class="board">
    <div class="price-panel">
        <div id="index-value">10,000.00</div>
        <div id="index-change" class="up">+0.00 (0.00%)</div>
        <table>
            <tr><th>Open</th><td id="stat-open">10,000.00</td></tr>
            <tr><th>High</th><td id="stat-high">10,000.00</td></tr>
            <tr><th>Low</th><td id="stat-low">10,000.00</td></tr>
            <tr><th>Ticks</th><td id="stat-ticks">0</td></tr>
        </table>
    </div>

    <div class="chart-wrap">
        <canvas id="chart"></canvas>
    </div>
</div>

<div class="ticker-tape">
    <div class="ticker-track" id="ticker-track"></div>
</div>

<script>
    const wsUrl = "ws://localhost:8080/ws";
    const statusEl = document.getElementById("status");
    const indexEl = document.getElementById("index-value");
    const changeEl = document.getElementById("index-change");
    const openEl = document.getElementById("stat-open");
    const highEl = document.getElementById("stat-high");
    const lowEl = document.getElementById("stat-low");
    const ticksEl = document.getElementById("stat-ticks");
    const tickerTrack = document.getElementById("ticker-track");

    const canvas = document.getElementById("chart");
    const ctx = canvas.getContext("2d");

    const START_VALUE = 10000;
    const VOLATILITY = 12; // how much each random tick can move the index
    const MAX_POINTS = 300;

    let indexValue = START_VALUE;
    let openValue = START_VALUE;
    let high = START_VALUE;
    let low = START_VALUE;
    let ticks = 0;
    let history = [START_VALUE];

    function resizeCanvas() {
        canvas.width = canvas.clientWidth * devicePixelRatio;
        canvas.height = canvas.clientHeight * devicePixelRatio;
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    function drawChart() {
        const w = canvas.width, h = canvas.height;
        ctx.clearRect(0, 0, w, h);

        if (history.length < 2) return;

        const min = Math.min(...history);
        const max = Math.max(...history);
        const range = (max - min) || 1;

        const rising = history[history.length - 1] >= history[0];
        ctx.strokeStyle = rising ? "#26a65b" : "#e5493a";
        ctx.lineWidth = 2 * devicePixelRatio;
        ctx.beginPath();

        history.forEach((v, i) => {
            const x = (i / (MAX_POINTS - 1)) * w;
            const y = h - ((v - min) / range) * h * 0.85 - h * 0.075;
            if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        });
        ctx.stroke();

        // fill under the line
        ctx.lineTo(w, h);
        ctx.lineTo(0, h);
        ctx.closePath();
        const gradient = ctx.createLinearGradient(0, 0, 0, h);
        gradient.addColorStop(0, rising ? "rgba(38,166,91,0.25)" : "rgba(229,73,58,0.25)");
        gradient.addColorStop(1, "rgba(0,0,0,0)");
        ctx.fillStyle = gradient;
        ctx.fill();
    }

    function pushTicker(value, delta) {
        const item = document.createElement("span");
        item.className = "ticker-item";
        const arrow = delta >= 0 ? "▲" : "▼";
        const color = delta >= 0 ? "#26a65b" : "#e5493a";
        item.innerHTML = `<span style="color:${color}">${arrow} ${value.toFixed(2)}</span>`;
        tickerTrack.appendChild(item);
        while (tickerTrack.childNodes.length > 40) {
            tickerTrack.removeChild(tickerTrack.firstChild);
        }
    }

    function connect() {
        const socket = new WebSocket(wsUrl);

        socket.onopen = () => {
            statusEl.textContent = "LIVE — " + wsUrl;
            statusEl.className = "connected";
        };

        socket.onmessage = (event) => {
            const rand = parseFloat(event.data); // 0..1 from the server
            const delta = (rand - 0.5) * 2 * VOLATILITY; // map to a price move
            indexValue = Math.max(0, indexValue + delta);

            ticks++;
            high = Math.max(high, indexValue);
            low = Math.min(low, indexValue);

            history.push(indexValue);
            if (history.length > MAX_POINTS) history.shift();

            const totalChange = indexValue - openValue;
            const pctChange = (totalChange / openValue) * 100;
            const isUp = totalChange >= 0;

            indexEl.textContent = indexValue.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
            indexEl.className = isUp ? "up" : "down";
            changeEl.textContent = (isUp ? "+" : "") + totalChange.toFixed(2) + " (" + (isUp ? "+" : "") + pctChange.toFixed(2) + "%)";
            changeEl.className = isUp ? "up" : "down";

            openEl.textContent = openValue.toFixed(2);
            highEl.textContent = high.toFixed(2);
            lowEl.textContent = low.toFixed(2);
            ticksEl.textContent = ticks;

            drawChart();
            pushTicker(indexValue, delta);
        };

        socket.onclose = () => {
            statusEl.textContent = "Disconnected — retrying in 1s...";
            statusEl.className = "disconnected";
            setTimeout(connect, 1000);
        };

        socket.onerror = () => socket.close();
    }

    connect();
</script>

</body>
</html>
