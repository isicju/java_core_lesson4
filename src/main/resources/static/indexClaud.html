<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>User Admin</title>
    <style>
        :root {
            --bg: #f7f7f8;
            --panel: #ffffff;
            --border: #e2e2e6;
            --text: #1c1c1f;
            --muted: #6b6b74;
            --accent: #2f5fd8;
            --accent-hover: #2450b8;
            --danger: #c0392b;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
        }
        .wrap {
            max-width: 760px;
            margin: 0 auto;
            padding: 32px 20px 60px;
        }
        h1 {
            font-size: 22px;
            font-weight: 600;
            margin: 0 0 4px;
        }
        .subtitle {
            color: var(--muted);
            font-size: 13px;
            margin: 0 0 24px;
        }
        .tabs {
            display: flex;
            gap: 4px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 20px;
        }
        .tab-btn {
            appearance: none;
            background: none;
            border: none;
            padding: 10px 16px;
            font-size: 14px;
            font-weight: 500;
            color: var(--muted);
            cursor: pointer;
            border-bottom: 2px solid transparent;
            margin-bottom: -1px;
        }
        .tab-btn:hover { color: var(--text); }
        .tab-btn.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }
        .panel {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 20px;
        }
        .hidden { display: none; }
        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }
        .row h2 {
            font-size: 15px;
            font-weight: 600;
            margin: 0;
        }
        button.icon-btn {
            appearance: none;
            border: 1px solid var(--border);
            background: var(--panel);
            color: var(--text);
            font-size: 13px;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
        }
        button.icon-btn:hover { border-color: var(--accent); color: var(--accent); }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        th, td {
            text-align: left;
            padding: 9px 8px;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }
        th {
            color: var(--muted);
            font-weight: 500;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.02em;
        }
        tr:last-child td { border-bottom: none; }

        .empty, .status {
            color: var(--muted);
            font-size: 13px;
            padding: 20px 4px;
            text-align: center;
        }
        .status.error { color: var(--danger); }

        form { display: grid; gap: 14px; }
        .field { display: grid; gap: 5px; }
        .field label {
            font-size: 12px;
            color: var(--muted);
            font-weight: 500;
        }
        .field input {
            font-size: 14px;
            padding: 9px 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: #fff;
            color: var(--text);
        }
        .field input:focus {
            outline: none;
            border-color: var(--accent);
        }
        .two-col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }
        .submit-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 4px;
        }
        button.primary {
            appearance: none;
            border: none;
            background: var(--accent);
            color: #fff;
            font-size: 14px;
            font-weight: 500;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
        }
        button.primary:hover { background: var(--accent-hover); }
        button.primary:disabled { opacity: 0.6; cursor: default; }

        .form-status { font-size: 13px; }
        .form-status.error { color: var(--danger); }
        .form-status.success { color: #1e8e3e; }

        .api-line {
            font-size: 12px;
            color: var(--muted);
            margin-top: 18px;
        }
        code {
            background: #eee;
            padding: 1px 5px;
            border-radius: 4px;
            font-size: 12px;
        }
    </style>
</head>
<body>
<div class="wrap">
    <h1>User Admin</h1>
    <p class="subtitle" id="apiTarget">Connecting to backend…</p>

    <div class="tabs">
        <button class="tab-btn active" data-tab="list">All Users</button>
        <button class="tab-btn" data-tab="add">Add User</button>
    </div>

    <!-- LIST TAB -->
    <div class="panel" id="tab-list">
        <div class="row">
            <h2>Users</h2>
            <button class="icon-btn" id="refreshBtn">Refresh</button>
        </div>
        <div id="listArea"><div class="status">Loading users…</div></div>
    </div>

    <!-- ADD TAB -->
    <div class="panel hidden" id="tab-add">
        <div class="row"><h2>Add a new user</h2></div>
        <form id="addForm">
            <div class="two-col">
                <div class="field">
                    <label for="f-name">Name</label>
                    <input id="f-name" name="name" type="text" required>
                </div>
                <div class="field">
                    <label for="f-surname">Surname</label>
                    <input id="f-surname" name="surname" type="text" required>
                </div>
            </div>
            <div class="two-col">
                <div class="field">
                    <label for="f-age">Age</label>
                    <input id="f-age" name="age" type="number" min="0" required>
                </div>
                <div class="field">
                    <label for="f-country">Country</label>
                    <input id="f-country" name="country" type="text" required>
                </div>
            </div>
            <div class="two-col">
                <div class="field">
                    <label for="f-profession">Profession</label>
                    <input id="f-profession" name="profession" type="text" required>
                </div>
                <div class="field">
                    <label for="f-email">Email</label>
                    <input id="f-email" name="email" type="email" required>
                </div>
            </div>
            <div class="submit-row">
                <button class="primary" type="submit" id="submitBtn">Create user</button>
                <span class="form-status" id="formStatus"></span>
            </div>
        </form>
    </div>

    <p class="api-line">API base: <code id="apiBaseLabel"></code></p>
</div>

<script>
    // Backend is assumed to run on the same host as this page, on port 8080,
    // regardless of what port/protocol this page itself is served from.
    const API_BASE = `${window.location.protocol}//${window.location.hostname}:${window.location.port}/api/users`;
    document.getElementById('apiTarget').textContent = 'Backend: ' + API_BASE;
    document.getElementById('apiBaseLabel').textContent = API_BASE;

    // ---- Tabs ----
    const tabButtons = document.querySelectorAll('.tab-btn');
    const panels = { list: document.getElementById('tab-list'), add: document.getElementById('tab-add') };
    tabButtons.forEach(btn => {
        btn.addEventListener('click', () => {
            tabButtons.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            Object.values(panels).forEach(p => p.classList.add('hidden'));
            panels[btn.dataset.tab].classList.remove('hidden');
            if (btn.dataset.tab === 'list') loadUsers();
        });
    });

    // ---- List users: GET /api/users ----
    async function loadUsers() {
        const area = document.getElementById('listArea');
        area.innerHTML = '<div class="status">Loading users…</div>';
        try {
            const res = await fetch(API_BASE);
            if (!res.ok) throw new Error('Request failed with status ' + res.status);
            const users = await res.json();

            if (!Array.isArray(users) || users.length === 0) {
                area.innerHTML = '<div class="empty">No users yet. Add one from the "Add User" tab.</div>';
                return;
            }

            const rows = users.map(u => `
        <tr>
          <td>${escapeHtml(u.id)}</td>
          <td>${escapeHtml(u.name)}</td>
          <td>${escapeHtml(u.surname)}</td>
          <td>${escapeHtml(u.age)}</td>
          <td>${escapeHtml(u.country)}</td>
          <td>${escapeHtml(u.profession)}</td>
          <td>${escapeHtml(u.email)}</td>
        </tr>
      `).join('');

            area.innerHTML = `
        <table>
          <thead>
            <tr>
              <th>ID</th><th>Name</th><th>Surname</th><th>Age</th>
              <th>Country</th><th>Profession</th><th>Email</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      `;
        } catch (err) {
            area.innerHTML = `<div class="status error">Couldn't load users from ${API_BASE}.<br>${escapeHtml(err.message)}</div>`;
        }
    }

    function escapeHtml(v) {
        if (v === null || v === undefined) return '';
        return String(v)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;');
    }

    document.getElementById('refreshBtn').addEventListener('click', loadUsers);

    // ---- Add user: POST /api/users ----
    const addForm = document.getElementById('addForm');
    const submitBtn = document.getElementById('submitBtn');
    const formStatus = document.getElementById('formStatus');

    addForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        formStatus.textContent = '';
        formStatus.className = 'form-status';
        submitBtn.disabled = true;
        submitBtn.textContent = 'Creating…';

        const payload = {
            name: document.getElementById('f-name').value.trim(),
            surname: document.getElementById('f-surname').value.trim(),
            age: Number(document.getElementById('f-age').value),
            country: document.getElementById('f-country').value.trim(),
            profession: document.getElementById('f-profession').value.trim(),
            email: document.getElementById('f-email').value.trim()
        };

        try {
            const res = await fetch(API_BASE, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            if (!res.ok) throw new Error('Request failed with status ' + res.status);
            const created = await res.json();

            formStatus.textContent = `Created user #${created.id ?? ''}.`;
            formStatus.className = 'form-status success';
            addForm.reset();

            // Jump back to the list tab and refresh
            document.querySelector('.tab-btn[data-tab="list"]').click();
        } catch (err) {
            formStatus.textContent = "Couldn't create user: " + err.message;
            formStatus.className = 'form-status error';
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Create user';
        }
    });

    // Initial load
    loadUsers();
</script>
</body>
</html>
