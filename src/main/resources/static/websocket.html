<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Random Value Stream</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #111;
            color: #eee;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 60px;
        }
        h1 { margin-bottom: 10px; }
        #status { margin-bottom: 20px; font-size: 14px; }
        .connected { color: #4caf50; }
        .disconnected { color: #f44336; }
        #value {
            font-size: 64px;
            font-weight: bold;
            color: #4fc3f7;
            margin-bottom: 20px;
        }
        #bar-container {
            width: 300px;
            height: 20px;
            background: #333;
            border-radius: 10px;
            overflow: hidden;
        }
        #bar {
            height: 100%;
            width: 0%;
            background: #4fc3f7;
            transition: width 0.05s linear;
        }
        #log {
            margin-top: 30px;
            width: 300px;
            height: 150px;
            overflow-y: auto;
            background: #1c1c1c;
            border: 1px solid #333;
            font-size: 12px;
            padding: 8px;
        }
    </style>
</head>
<body>

<h1>Random Value Stream</h1>
<div id="status" class="disconnected">Disconnected</div>
<div id="value">--</div>
<div id="bar-container"><div id="bar"></div></div>
<div id="log"></div>

<script>
    const wsUrl = "ws://localhost:8080/ws";
    const statusEl = document.getElementById("status");
    const valueEl = document.getElementById("value");
    const barEl = document.getElementById("bar");
    const logEl = document.getElementById("log");

    function connect() {
        const socket = new WebSocket(wsUrl);

        socket.onopen = () => {
            statusEl.textContent = "Connected to " + wsUrl;
            statusEl.className = "connected";
        };

        socket.onmessage = (event) => {
            const value = parseFloat(event.data);
            valueEl.textContent = value.toFixed(4);
            barEl.style.width = (value * 100).toFixed(2) + "%";

            const line = document.createElement("div");
            line.textContent = new Date().toLocaleTimeString() + "  " + value.toFixed(4);
            logEl.prepend(line);
            while (logEl.childNodes.length > 100) {
                logEl.removeChild(logEl.lastChild);
            }
        };

        socket.onclose = () => {
            statusEl.textContent = "Disconnected — retrying in 1s...";
            statusEl.className = "disconnected";
            setTimeout(connect, 1000);
        };

        socket.onerror = () => {
            socket.close();
        };
    }

    connect();
</script>

</body>
</html>
