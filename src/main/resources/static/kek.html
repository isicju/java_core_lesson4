<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Video</title>
</head>
<body>

<h1>Video</h1>

<button id="showVideo">Show Video</button>
<button id="downloadVideo">Download Video</button>

<br><br>

<video id="video" width="640" controls style="display: none;">
    Your browser does not support the video tag.
</video>

<script>
    const video = document.getElementById("video");
    const showButton = document.getElementById("showVideo");
    const downloadButton = document.getElementById("downloadVideo");

    showButton.addEventListener("click", () => {
        video.src = "/api/users/video";
        video.style.display = "block";
        video.load();
    });

    downloadButton.addEventListener("click", () => {
        window.location.href = "/api/users/video/download";
    });
</script>

</body>
</html>
